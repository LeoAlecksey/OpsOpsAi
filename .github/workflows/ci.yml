# Checks and test builds. Publishes nothing: releases, signing and the public release repo come
# in a separate step.
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: frontend (types, unit tests, audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm audit --audit-level=high

  rust:
    name: rust (clippy, tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: system libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev
      - name: toolchain from rust-toolchain.toml
        run: rustup toolchain install --no-self-update && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # generate_context! needs the frontend folder to exist; its content does not matter here
      - run: mkdir -p dist && echo '<!doctype html>' > dist/index.html
      - working-directory: src-tauri
        run: cargo clippy --lib --tests --locked -- -D warnings
      - working-directory: src-tauri
        run: cargo test --lib --locked
      - name: cargo audit
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --locked
          cargo audit

  build:
    name: build ${{ matrix.name }}
    needs: [frontend, rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
          - name: linux-arm64
            os: ubuntu-22.04-arm
          - name: windows-x64
            os: windows-2022
          - name: macos-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - name: toolchain from rust-toolchain.toml
        run: rustup toolchain install --no-self-update && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # unsigned test packages: code signing and updater artifacts are a later step
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: opsopsai-${{ matrix.name }}
          retention-days: 7
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
