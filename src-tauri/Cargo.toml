[package]
name = "opsopsai"
version = "0.2.2"
edition = "2021"
description = "OpsOpsAi — desktop app for local AI and agents (Tauri backend)"
license-file = "../LICENSE"
authors = ["LeoAlecksey"]
publish = false

[lib]
name = "opsopsai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Зависимости добавляются вместе с кодом, которому они нужны, — не заранее.
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri-plugin-log = "2"
dirs = "6"
# in-app updates from GitHub Releases, signature checked against the public key in tauri.conf.json
tauri-plugin-updater = "2"
# local AI: HTTP to the engine and downloads; unpacking the engine (tar.gz / zip) and checking sha256
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
base64 = "0.22"
# memory and disk size to judge which models this computer can run
sysinfo = "0.37"
# native pickers for attaching files and folders
tauri-plugin-dialog = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
# session token for the local engine
uuid = { version = "1", features = ["v4"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
